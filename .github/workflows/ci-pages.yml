name: CI & GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  # Build genérico (sem basePath): valida código e produz o artefato
  # "flappy-aurora-offline" — site estático portável para qualquer
  # hospedagem free (Netlify Drop, Cloudflare Pages, GitHub Pages...).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: flappy-aurora-offline
          path: out
          if-no-files-found: error

  # Publica no GitHub Pages SÓ se ele estiver habilitado no repo
  # (repo privado exige plano Pro; em repo público é grátis).
  # Quando habilitado, refaz o build com basePath = /<repo> para a
  # subpasta do GitHub Pages.
  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Decide deploy target
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIS=$(gh api "repos/${GITHUB_REPOSITORY}" -q .visibility)
          if [ "$VIS" = "public" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Repo público — publicando no GitHub Pages."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Repo $VIS. Pages via Actions exige repo público (ou plano pago). O build estático portável está no artefato 'flappy-aurora-offline' — baixe e publique em Netlify Drop, Cloudflare Pages ou um repo público."
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.deploy == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.deploy == 'true'
      - name: Build with Pages base path
        if: steps.check.outputs.deploy == 'true'
        run: PAGES_BASE=/${{ github.event.repository.name }} npm run build
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.deploy == 'true'
        with:
          path: out
      - id: deployment
        if: steps.check.outputs.deploy == 'true'
        # Pages em conta/repo novo pode levar o 1o deploy para provisionar;
        # não deixa o run ficar vermelho por isso — o build estático já sai
        # no artefato 'flappy-aurora-offline' do job quality.
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Report Pages status
        if: steps.check.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "✅ Publicado em ${{ steps.deployment.outputs.page_url }}"
          else
            echo "::warning::Deploy de Pages falhou (provável conta/repo novo ainda sem Pages provisionado). Tente o próximo push. O site estático está no artefato 'flappy-aurora-offline'."
          fi
