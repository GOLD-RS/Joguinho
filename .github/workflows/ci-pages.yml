name: CI & GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  # Build genérico (sem basePath): valida código e produz o artefato
  # "flappy-aurora-offline" — site estático portável para qualquer
  # hospedagem free (Netlify Drop, Cloudflare Pages, GitHub Pages...).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: flappy-aurora-offline
          path: out
          if-no-files-found: error

  # Publica no GitHub Pages SÓ se ele estiver habilitado no repo
  # (repo privado exige plano Pro; em repo público é grátis).
  # Quando habilitado, refaz o build com basePath = /<repo> para a
  # subpasta do GitHub Pages.
  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check if GitHub Pages is available
        id: pages-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages não habilitado neste repo (privado + plano free não suportam Pages). O site estático portável está no artefato 'flappy-aurora-offline' deste run — baixe e publique em Netlify Drop (app.netlify.com/drop), Cloudflare Pages ou um repo público com Pages."
          fi
      - uses: actions/checkout@v4
        if: steps.pages-check.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.pages-check.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.pages-check.outputs.enabled == 'true'
      - name: Build with Pages base path
        if: steps.pages-check.outputs.enabled == 'true'
        run: PAGES_BASE=/${{ github.event.repository.name }} npm run build
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-check.outputs.enabled == 'true'
        with:
          path: out
      - id: deployment
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
